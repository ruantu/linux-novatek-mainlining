%YAML 1.2
---
$id: http://devicetree.org/schemas/serial/novatek,na51089-uart.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NA51089 UART

maintainers:
  - Yudong Zhang <mtwget@gmail.com>

description: |
  Novatek SoCs integrate 16550-compatible UART controllers with vendor
  extensions. This binding describes the two enhanced UARTs in the NA51089,
  which have 64-byte FIFOs, hardware RTS/CTS flow control and native RS-485
  direction control. The flow-control and RS-485 direction signals share a
  pinmux field and cannot be used at the same time. The basic UART0 is described
  by the generic ns16550a binding instead.

allOf:
  - $ref: /schemas/serial/serial.yaml#
  - $ref: /schemas/serial/rs485.yaml#
  - if:
      required:
        - uart-has-rtscts
    then:
      properties:
        linux,rs485-enabled-at-boot-time: false
        rs485-rts-delay: false
        rs485-rts-active-high: false
        rs485-rts-active-low: false
        rs485-rx-active-high: false
        rs485-rx-during-tx: false
        rs485-term-gpios: false
        rs485-rx-during-tx-gpios: false
  - if:
      required:
        - linux,rs485-enabled-at-boot-time
        - rs485-rts-delay
    then:
      required:
        - current-speed

properties:
  compatible:
    const: novatek,na51089-uart

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names: false

  resets:
    maxItems: 1

  reset-names: false

  reg-shift:
    const: 2

  reg-io-width:
    const: 4

  current-speed:
    $ref: /schemas/types.yaml#/definitions/uint32
    minimum: 1
    description: The current active baud rate configured by firmware.

  clock-frequency: false
  fifo-size: false
  auto-flow-control: false
  dmas: false
  dma-names: false

  cts-gpios: false
  dcd-gpios: false
  dsr-gpios: false
  dtr-gpios: false
  rng-gpios: false
  rts-gpios: false
  rx-tx-swap: false
  cts-rts-swap: false
  rx-threshold: false
  tx-threshold: false

  rs485-rts-active-low: false
  rs485-rx-active-high: false
  rs485-rx-during-tx: false

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - resets
  - reg-shift
  - reg-io-width

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/novatek,na51089-clock.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/reset/novatek,na51089-reset.h>

    serial@f0300000 {
        compatible = "novatek,na51089-uart";
        reg = <0xf0300000 0x1000>;
        assigned-clocks = <&cgu NA51089_CLK_UART1>;
        assigned-clock-rates = <48000000>;
        clocks = <&cgu NA51089_CLK_UART1>;
        interrupts = <GIC_SPI 44 IRQ_TYPE_LEVEL_HIGH>;
        reg-io-width = <4>;
        reg-shift = <2>;
        resets = <&cgu NA51089_RESET_UART1>;
    };

...
