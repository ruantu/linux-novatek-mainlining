%YAML 1.2
---
$id: http://devicetree.org/schemas/timer/novatek,na51089-timer.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NA51089 timer

maintainers:
  - Yudong Zhang <mtwget@gmail.com>

description:
  The NA51089 timer controller contains twenty 32-bit timers sharing an
  interrupt and two clock dividers. Each timer supports free-running and
  one-shot operation.

properties:
  compatible:
    const: novatek,na51089-timer

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  interrupts:
    maxItems: 1

  resets:
    maxItems: 1

required:
  - compatible
  - reg
  - clocks
  - interrupts
  - resets

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/novatek,na51089-clock.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/reset/novatek,na51089-reset.h>

    timer@f0040000 {
        compatible = "novatek,na51089-timer";
        reg = <0xf0040000 0x240>;
        clocks = <&cgu NA51089_CLK_TIMER>;
        interrupts = <GIC_SPI 0 IRQ_TYPE_LEVEL_HIGH>;
        resets = <&cgu NA51089_RESET_TIMER>;
    };

...
