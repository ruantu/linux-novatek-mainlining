%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/novatek.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NA51089 SoC

maintainers:
  - Yu-Tung Chang <mtwget@gmail.com>

description:
  The Novatek NA51089 SoC combines an ARM Cortex-A9 processor with integrated
  peripheral controllers.

properties:
  $nodename:
    const: '/'

  compatible:
    contains:
      const: novatek,na51089

  cpus:
    type: object
    additionalProperties: true

    patternProperties:
      '^cpu@[0-9a-f]+$':
        type: object
        additionalProperties: true

        properties:
          clocks:
            items:
              - description: CPU clock mux output
              - description: Programmable PLL8 CPU clock source
              - description: Fixed 480 MHz CPU clock source

          clock-names:
            items:
              - const: cpu
              - const: pll8
              - const: fixed480

        dependentRequired:
          clocks: [clock-names]
          clock-names: [clocks]

required:
  - compatible

additionalProperties: true
