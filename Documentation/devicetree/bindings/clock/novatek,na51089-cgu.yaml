%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/novatek,na51089-cgu.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NA51089 Clock and Reset Controller

maintainers:
  - Yudong Zhang <mtwget@gmail.com>

description: |
  The clock generation unit provides clocks and reset signals for the CPU and
  peripheral blocks of the Novatek NA51089 SoC.

properties:
  compatible:
    const: novatek,na51089-cgu

  reg:
    maxItems: 1

  clocks:
    description: 12 MHz oscillator input
    maxItems: 1

  clock-names:
    const: osc

  '#clock-cells':
    description: |
      The clock ID is defined in
      include/dt-bindings/clock/novatek,na51089-clock.h.
    const: 1

  '#reset-cells':
    description: |
      The reset ID is defined in
      include/dt-bindings/reset/novatek,na51089-reset.h.
    const: 1

required:
  - compatible
  - reg
  - clocks
  - clock-names
  - '#clock-cells'
  - '#reset-cells'

additionalProperties: false

examples:
  - |
    clock-controller@f0020000 {
        compatible = "novatek,na51089-cgu";
        reg = <0xf0020000 0x5000>;
        clocks = <&osc>;
        clock-names = "osc";
        #clock-cells = <1>;
        #reset-cells = <1>;
    };
