%YAML 1.2
---
$id: http://devicetree.org/schemas/power/novatek,na51089-sramctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NA51089 SRAM power controller

maintainers:
  - Yu-Tung Chang <mtwget@gmail.com>

properties:
  compatible:
    const: novatek,na51089-sramctrl

  reg:
    maxItems: 1

  "#power-domain-cells":
    const: 1
    description:
      The power domain IDs are defined in
      dt-bindings/power/novatek,na51089-sramctrl.h.

required:
  - compatible
  - reg
  - "#power-domain-cells"

additionalProperties: false

examples:
  - |
    power-controller@f0011000 {
        compatible = "novatek,na51089-sramctrl";
        reg = <0xf0011000 0x4>;
        #power-domain-cells = <1>;
    };

...
