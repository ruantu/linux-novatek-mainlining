      bias-bus-hold: true
      bias-disable: true

      bias-pull-down:
        type: boolean

      bias-pull-up:
        type: boolean

      drive-strength:
        enum: [3, 4, 6, 8, 9, 10, 12, 15, 16, 18, 21, 24]

    oneOf:
      - required:
          - function
          - groups
        properties:
          pins: false
      - required:
          - groups
        properties:
          function: false
          pins: false
      - required:
          - pins
        properties:
          function: false
          groups: false

required:
  - compatible
  - reg
  - reg-names

additionalProperties: false

examples:
  - |
    / {
      #address-cells = <1>;
      #size-cells = <1>;

      pinctrl: pinctrl@f0010000 {
        compatible = "novatek,na51089-pinctrl";
        reg = <0xf0010000 0x1000>,
              <0xf0030000 0x2000>;
        reg-names = "top", "pad";

        uart0-default-pins {
          function = "uart0";
          groups = "uart0-pins";
          bias-pull-up;
          drive-strength = <8>;
        };
      };
    };

  - |
    / {
      #address-cells = <1>;
      #size-cells = <1>;

      pinctrl@f0010000 {
        compatible = "novatek,na51089-pinctrl";
        reg = <0xf0010000 0x1000>,
              <0xf0030000 0x2000>;
        reg-names = "top", "pad";

        high-speed-input-pins {
          pins = "hgpio0", "hgpio1";
          bias-bus-hold;
          drive-strength = <10>;
        };
      };
    };

...
