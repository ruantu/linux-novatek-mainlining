%YAML 1.2
---
$id: http://devicetree.org/schemas/pinctrl/novatek,na51089-pinctrl.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NA51089 pinctrl

maintainers:
  - Yudong Zhang <mtwget@gmail.com>

allOf:
  - $ref: pinctrl.yaml#

properties:
  compatible:
    const: novatek,na51089-pinctrl

  reg:
    items:
      - description: TOP pin multiplexing registers
      - description: PAD electrical configuration registers

  reg-names:
    items:
      - const: top
      - const: pad

patternProperties:
  "-pins(-[a-e])?$":
    type: object
    allOf:
      - $ref: pinmux-node.yaml#
      - $ref: pincfg-node.yaml#
    additionalProperties: false

    properties:
      function:
        enum:
          - sdio0
          - sdio1
          - sdio2
          - i2c0
          - i2c1
          - i2c2
