%YAML 1.2
---
$id: http://devicetree.org/schemas/net/novatek,na51089-dwmac.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NA51089 Ethernet MAC

maintainers:
  - Yu-Tung Chang <mtwget@gmail.com>

allOf:
  - $ref: snps,dwmac.yaml#
  - if:
      properties:
        phy-mode:
          const: mii
    then:
      properties:
        novatek,rmii-refclk-out: false

properties:
  compatible:
    const: novatek,na51089-dwmac

  reg:
    maxItems: 1
    description:
      MAC core, PHY selection, RMII control and internal PHY registers.

  reg-names:
    const: mac

  interrupts:
    maxItems: 1

  interrupt-names:
    const: macirq

  clocks:
    minItems: 2
    items:
      - description: APB register interface and MDIO divider clock
      - description: Ethernet reference clock
      - description: 25 MHz reference clock output for an external PHY

  clock-names:
    minItems: 2
    items:
      - const: stmmaceth
      - const: ethref
      - const: phy-ref

  resets:
    maxItems: 1

  reset-names:
    const: stmmaceth

  phy-mode:
    enum: [mii, rmii]

  max-speed:
    enum: [10, 100]

  power-domains:
    maxItems: 1

  novatek,rmii-refclk-out:
    type: boolean
    description:
      Drive the 50 MHz RMII reference clock to an external PHY. When absent,
      the MAC uses an external reference clock.

  mdio-mux:
    type: object
    unevaluatedProperties: false
    description:
      Selects between the internal PHY and the external MDIO interface.

    properties:
      compatible:
        const: novatek,na51089-mdio-mux

      mdio-parent-bus:
        $ref: /schemas/types.yaml#/definitions/phandle
        description: Phandle to the MAC MDIO bus.

      resets:
        maxItems: 1
        description: Internal PHY hardware reset.

      reset-names:
        const: phy

      '#address-cells':
        const: 1

      '#size-cells':
        const: 0

      mdio@0:
        $ref: mdio.yaml#
        unevaluatedProperties: false
        description: Internal MDIO bus.

        properties:
          reg:
            const: 0

        patternProperties:
          '^ethernet-phy@[0-9a-f]+$':
            type: object
            $ref: ethernet-phy.yaml#
            unevaluatedProperties: false

            properties:
              resets: false
              reset-names: false

            required:
              - reg

        required:
          - reg
          - '#address-cells'
          - '#size-cells'

      mdio@1:
        $ref: mdio.yaml#
        unevaluatedProperties: false
        description: External MDIO bus.

        properties:
          reg:
            const: 1

        required:
          - reg
          - '#address-cells'
          - '#size-cells'

    required:
      - compatible
      - mdio-parent-bus
      - '#address-cells'
      - '#size-cells'

    dependentRequired:
      resets: [reset-names]
      reset-names: [resets]

    allOf:
      - if:
          required:
            - mdio@0
        then:
          required:
            - resets
            - reset-names

required:
  - compatible
  - reg
  - reg-names
  - interrupts
  - interrupt-names
  - clocks
  - clock-names
  - resets
  - reset-names
  - phy-mode
  - power-domains
  - mdio
  - mdio-mux

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/novatek,na51089-clock.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/power/novatek,na51089-sramctrl.h>
    #include <dt-bindings/reset/novatek,na51089-reset.h>

    ethernet@f02b0000 {
        compatible = "novatek,na51089-dwmac";
        reg = <0xf02b0000 0x3c00>;
        reg-names = "mac";
        interrupts = <GIC_SPI 34 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "macirq";
        clocks = <&cgu NA51089_CLK_APB>, <&cgu NA51089_CLK_ETH>;
        clock-names = "stmmaceth", "ethref";
        resets = <&cgu NA51089_RESET_ETH>;
        reset-names = "stmmaceth";
        power-domains = <&sramctrl NA51089_SRAM_SW_ETH>;
        phy-mode = "mii";
        phy-handle = <&internal_phy>;
        max-speed = <100>;

        mdio0: mdio {
            compatible = "snps,dwmac-mdio";
            #address-cells = <1>;
            #size-cells = <0>;
        };

        mdio-mux {
            compatible = "novatek,na51089-mdio-mux";
            mdio-parent-bus = <&mdio0>;
            resets = <&cgu NA51089_RESET_ETH_PHY>;
            reset-names = "phy";
            #address-cells = <1>;
            #size-cells = <0>;

            mdio@0 {
                reg = <0>;
                #address-cells = <1>;
                #size-cells = <0>;

                internal_phy: ethernet-phy@0 {
                    compatible = "ethernet-phy-ieee802.3-c22";
                    reg = <0>;
                };
            };

            mdio@1 {
                reg = <1>;
                #address-cells = <1>;
                #size-cells = <0>;
            };
        };
    };

  - |
    #include <dt-bindings/clock/novatek,na51089-clock.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/power/novatek,na51089-sramctrl.h>
    #include <dt-bindings/reset/novatek,na51089-reset.h>

    ethernet@f02b0000 {
        compatible = "novatek,na51089-dwmac";
        reg = <0xf02b0000 0x3c00>;
        reg-names = "mac";
        interrupts = <GIC_SPI 34 IRQ_TYPE_LEVEL_HIGH>;
        interrupt-names = "macirq";
        clocks = <&cgu NA51089_CLK_APB>, <&cgu NA51089_CLK_ETH>,
                 <&cgu NA51089_CLK_ETH_EXT_PHY>;
        clock-names = "stmmaceth", "ethref", "phy-ref";
        resets = <&cgu NA51089_RESET_ETH>;
        reset-names = "stmmaceth";
        power-domains = <&sramctrl NA51089_SRAM_SW_ETH>;
        phy-mode = "rmii";
        phy-handle = <&external_phy>;
        novatek,rmii-refclk-out;
        max-speed = <100>;

        mdio1: mdio {
            compatible = "snps,dwmac-mdio";
            #address-cells = <1>;
            #size-cells = <0>;
        };

        mdio-mux {
            compatible = "novatek,na51089-mdio-mux";
            mdio-parent-bus = <&mdio1>;
            #address-cells = <1>;
            #size-cells = <0>;

            mdio@1 {
                reg = <1>;
                #address-cells = <1>;
                #size-cells = <0>;

                external_phy: ethernet-phy@1 {
                    reg = <1>;
                };
            };
        };
    };
