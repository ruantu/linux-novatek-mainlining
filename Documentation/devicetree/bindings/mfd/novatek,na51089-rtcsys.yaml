%YAML 1.2
---
$id: http://devicetree.org/schemas/mfd/novatek,na51089-rtcsys.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NA51089 RTC System Controller

maintainers:
  - Yu-Tung Chang <mtwget@gmail.com>

properties:
  compatible:
    const: novatek,na51089-rtcsys

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  resets:
    maxItems: 1

  rtc:
    type: object
    $ref: /schemas/rtc/novatek,na51089-rtc.yaml#

  power-controller:
    type: object
    $ref: /schemas/power/reset/novatek,na51089-pwbc.yaml#

required:
  - compatible
  - reg
  - interrupts
  - resets
  - rtc

additionalProperties: false

examples:
  - |
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/reset/novatek,na51089-reset.h>

    rtc@f0060000 {
        compatible = "novatek,na51089-rtcsys";
        reg = <0xf0060000 0x100>;
        interrupts = <GIC_SPI 56 IRQ_TYPE_LEVEL_HIGH>;
        resets = <&cgu NA51089_RESET_RTC>;

        rtc {
            compatible = "novatek,na51089-rtc";
            wakeup-source;
        };

        power-controller {
            compatible = "novatek,na51089-pwbc";
            system-power-controller;
        };
    };

...
