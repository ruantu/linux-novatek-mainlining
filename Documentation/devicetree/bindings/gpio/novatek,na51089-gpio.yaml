%YAML 1.2
---
$id: http://devicetree.org/schemas/gpio/novatek,na51089-gpio.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NA51089 GPIO controller

maintainers:
  - Yudong Zhang <mtwget@gmail.com>

properties:
  compatible:
    const: novatek,na51089-gpio

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  gpio-controller: true

  "#gpio-cells":
    const: 2

  gpio-ranges:
    minItems: 8
    maxItems: 8

  interrupt-controller: true

  "#address-cells":
    const: 0

  "#interrupt-cells":
    const: 2

required:
  - compatible
  - reg
  - interrupts
  - gpio-controller
  - "#gpio-cells"
  - gpio-ranges
  - interrupt-controller
  - "#address-cells"
  - "#interrupt-cells"

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/novatek,na51089-gpio.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>

    / {
      #address-cells = <1>;
      #size-cells = <1>;
      interrupt-parent = <&gic>;

      gic: interrupt-controller@ffd01000 {
        compatible = "arm,cortex-a9-gic";
        reg = <0xffd01000 0x1000>,
              <0xffd00100 0x100>;
        interrupt-controller;
        #address-cells = <0>;
        #interrupt-cells = <3>;
      };

      pinctrl: pinctrl@f0010000 {
        compatible = "novatek,na51089-pinctrl";
        reg = <0xf0010000 0x2000>,
              <0xf0030000 0x2000>;
        reg-names = "top", "pad";
      };

      gpio: gpio@f0070000 {
        compatible = "novatek,na51089-gpio";
        reg = <0xf0070000 0x100>;
        interrupts = <GIC_SPI 24 IRQ_TYPE_LEVEL_HIGH>;
        gpio-controller;
        #gpio-cells = <2>;
        gpio-ranges = <&pinctrl NA51089_CGPIO(0) NA51089_CGPIO(0) 23>,
                      <&pinctrl NA51089_PGPIO(0) NA51089_PGPIO(0) 26>,
                      <&pinctrl NA51089_SGPIO(0) NA51089_SGPIO(0) 9>,
                      <&pinctrl NA51089_LGPIO(0) NA51089_LGPIO(0) 10>,
                      <&pinctrl NA51089_DGPIO(0) NA51089_DGPIO(0) 8>,
                      <&pinctrl NA51089_HGPIO(0) NA51089_HGPIO(0) 12>,
                      <&pinctrl NA51089_AGPIO(0) NA51089_AGPIO(0) 3>,
                      <&pinctrl NA51089_DSIGPIO(0) NA51089_DSIGPIO(0) 11>;
        interrupt-controller;
        #address-cells = <0>;
        #interrupt-cells = <2>;
      };
    };

...
