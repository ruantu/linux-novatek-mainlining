%YAML 1.2
---
$id: http://devicetree.org/schemas/i2c/novatek,na51089-i2c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NA51089 I2C controller

maintainers:
  - Yu-Tung Chang <mtwget@gmail.com>

allOf:
  - $ref: /schemas/i2c/i2c-controller.yaml#

properties:
  compatible:
    const: novatek,na51089-i2c

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  interrupts:
    maxItems: 1

  resets:
    maxItems: 1

  clock-frequency:
    maximum: 1000000
    default: 100000

  novatek,no-dma:
    description: Disable internal DMA and use PIO only.
    type: boolean

required:
  - compatible
  - reg
  - clocks
  - interrupts
  - resets

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/novatek,na51089-clock.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/reset/novatek,na51089-reset.h>

    i2c@f0220000 {
        compatible = "novatek,na51089-i2c";
        reg = <0xf0220000 0x40>;
        clocks = <&cgu NA51089_CLK_I2C0>;
        interrupts = <GIC_SPI 41 IRQ_TYPE_LEVEL_HIGH>;
        resets = <&cgu NA51089_RESET_I2C0>;
        clock-frequency = <100000>;
        #address-cells = <1>;
        #size-cells = <0>;
    };
