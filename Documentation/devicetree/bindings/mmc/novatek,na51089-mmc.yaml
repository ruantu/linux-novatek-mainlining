%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/novatek,na51089-mmc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NA51089 SD/SDIO/eMMC controller

maintainers:
  - Yudong Zhang <mtwget@gmail.com>

description:
  The NA51089 contains three SD/MMC host controllers with an internal FIFO.
  The first two controllers support 1-bit and 4-bit buses. The third also
  supports an 8-bit bus and has a separate internal SRAM shutdown control.
  This binding describes the basic SDR modes up to 48 MHz. Faster modes,
  signal voltage switching and the internal DMA engine are not supported.

allOf:
  - $ref: mmc-controller.yaml#

properties:
  compatible:
    const: novatek,na51089-mmc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  clock-names: false

  resets:
    maxItems: 1

  reset-names: false

  regmap:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the SRAM controller providing the internal SRAM shutdown
      control. Required for the third host controller, which supports an
      8-bit bus; the first two controllers do not have this control.

  max-frequency:
    maximum: 48000000

  sd-uhs-sdr12: false
  sd-uhs-sdr25: false
  sd-uhs-sdr50: false
  sd-uhs-sdr104: false
  sd-uhs-ddr50: false
  mmc-ddr-1_2v: false
  mmc-ddr-1_8v: false
  mmc-ddr-3_3v: false
  mmc-hs200-1_2v: false
  mmc-hs200-1_8v: false
  mmc-hs400-1_2v: false
  mmc-hs400-1_8v: false
  mmc-hs400-enhanced-strobe: false
  cap-mmc-hw-reset: false
  dmas: false
  dma-names: false

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - resets

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/novatek,na51089-clock.h>
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/gpio/novatek,na51089-gpio.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/reset/novatek,na51089-reset.h>

    mmc@f0420000 {
        compatible = "novatek,na51089-mmc";
        reg = <0xf0420000 0x1000>;
        clocks = <&cgu NA51089_CLK_SDIO0>;
        interrupts = <GIC_SPI 30 IRQ_TYPE_LEVEL_HIGH>;
        resets = <&cgu NA51089_RESET_SDIO0>;
        pinctrl-names = "default";
        pinctrl-0 = <&sdio0_pins>;
        bus-width = <4>;
        max-frequency = <48000000>;
        cd-gpios = <&gpio NA51089_CGPIO(9) GPIO_ACTIVE_LOW>;
        vmmc-supply = <&reg_tf_3v3>;
        cap-sd-highspeed;
        disable-wp;
        no-1-8-v;
    };

...
