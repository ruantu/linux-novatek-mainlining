%YAML 1.2
---
$id: http://devicetree.org/schemas/mmc/novatek,na51089-mmc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NA51089 SD/SDIO/eMMC controller

maintainers:
  - Yu-Tung Chang <mtwget@gmail.com>

allOf:
  - $ref: mmc-controller.yaml#
  - if:
      properties:
        reg:
          items:
            - items:
                - const: 0xf0510000
                - true
    then:
      required:
        - power-domains
  - if:
      anyOf:
        - required: [sd-uhs-sdr12]
        - required: [sd-uhs-sdr25]
        - required: [sd-uhs-sdr50]
        - required: [sd-uhs-sdr104]
    then:
      properties:
        no-1-8-v: false
      required:
        - vqmmc-supply
  - if:
      properties:
        reg:
          items:
            - items:
                - const: 0xf0420000
                - true
      anyOf:
        - required: [sd-uhs-sdr12]
        - required: [sd-uhs-sdr25]
        - required: [sd-uhs-sdr50]
        - required: [sd-uhs-sdr104]
    then:
      properties:
        pinctrl-names:
          minItems: 3
      required:
        - pinctrl-names
        - pinctrl-1
        - pinctrl-2

properties:
  compatible:
    const: novatek,na51089-mmc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  pinctrl-names:
    description:
      MMC0 requires both voltage states to configure its PAD supply.
    oneOf:
      - items:
          - const: default
      - items:
          - const: default
          - const: sdmmc-3v3
          - const: sdmmc-1v8

  novatek,no-dma:
    type: boolean
    description: Disable internal DMA and use PIO only.

  power-domains:
    maxItems: 1
    description:
      Internal SRAM power domain of the third host controller.

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - resets

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/novatek,na51089-clock.h>
    #include <dt-bindings/gpio/gpio.h>
    #include <dt-bindings/gpio/novatek,na51089-gpio.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/reset/novatek,na51089-reset.h>

    mmc@f0420000 {
        compatible = "novatek,na51089-mmc";
        reg = <0xf0420000 0x1000>;
        clocks = <&cgu NA51089_CLK_SDIO0>;
        interrupts = <GIC_SPI 30 IRQ_TYPE_LEVEL_HIGH>;
        resets = <&cgu NA51089_RESET_SDIO0>;
        pinctrl-names = "default";
        pinctrl-0 = <&sdio0_pins>;
        bus-width = <4>;
        max-frequency = <48000000>;
        cd-gpios = <&gpio NA51089_CGPIO(9) GPIO_ACTIVE_LOW>;
        vmmc-supply = <&reg_tf_3v3>;
        cap-sd-highspeed;
        disable-wp;
        no-1-8-v;
    };

  - |
    #include <dt-bindings/clock/novatek,na51089-clock.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/power/novatek,na51089-sramctrl.h>
    #include <dt-bindings/reset/novatek,na51089-reset.h>

    mmc@f0510000 {
        compatible = "novatek,na51089-mmc";
        reg = <0xf0510000 0x1000>;
        clocks = <&cgu NA51089_CLK_SDIO2>;
        interrupts = <GIC_SPI 32 IRQ_TYPE_LEVEL_HIGH>;
        resets = <&cgu NA51089_RESET_SDIO2>;
        power-domains = <&sramctrl NA51089_SRAM_SW_SDIO3>;
        bus-width = <8>;
        max-frequency = <48000000>;
    };

...
