%YAML 1.2
---
$id: http://devicetree.org/schemas/rtc/novatek,na51089-drtc.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NA51089 Digital Real Time Clock

maintainers:
  - Yu-Tung Chang <mtwget@gmail.com>

allOf:
  - $ref: rtc.yaml#

properties:
  compatible:
    const: novatek,na51089-drtc

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - resets

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/novatek,na51089-clock.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/reset/novatek,na51089-reset.h>

    rtc@f00b0000 {
        compatible = "novatek,na51089-drtc";
        reg = <0xf00b0000 0x100>;
        clocks = <&cgu NA51089_CLK_DRTC>;
        interrupts = <GIC_SPI 4 IRQ_TYPE_LEVEL_HIGH>;
        resets = <&cgu NA51089_RESET_DRTC>;
    };

...
