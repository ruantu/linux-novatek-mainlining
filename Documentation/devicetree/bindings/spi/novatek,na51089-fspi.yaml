%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/novatek,na51089-fspi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NA51089 Flash SPI controller

maintainers:
  - Yu-Tung Chang <mtwget@gmail.com>

allOf:
  - $ref: /schemas/spi/spi-controller.yaml#

properties:
  compatible:
    const: novatek,na51089-fspi

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  novatek,no-dma:
    type: boolean
    description: Use PIO transfers only.

  spi-slave: false

  power-domains:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - resets
  - power-domains
  - "#address-cells"
  - "#size-cells"

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/novatek,na51089-clock.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/power/novatek,na51089-sramctrl.h>
    #include <dt-bindings/reset/novatek,na51089-reset.h>

    fspi: spi@f0400000 {
        compatible = "novatek,na51089-fspi";
        reg = <0xf0400000 0x1000>;
        clocks = <&cgu NA51089_CLK_FSPI>;
        interrupts = <GIC_SPI 29 IRQ_TYPE_LEVEL_HIGH>;
        resets = <&cgu NA51089_RESET_FSPI>;
        power-domains = <&sramctrl NA51089_SRAM_SW_FSPI>;
        #address-cells = <1>;
        #size-cells = <0>;

        flash@0 {
            compatible = "spi-nand";
            reg = <0>;
            spi-max-frequency = <40000000>;
            spi-rx-bus-width = <4>;
            spi-tx-bus-width = <4>;
            nand-ecc-engine = <&fspi>;
            nand-ecc-algo = "rs";
            nand-ecc-strength = <4>;
            nand-ecc-step-size = <512>;
        };
    };

...
