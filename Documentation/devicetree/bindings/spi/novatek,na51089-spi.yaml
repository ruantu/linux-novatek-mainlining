%YAML 1.2
---
$id: http://devicetree.org/schemas/spi/novatek,na51089-spi.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NA51089 SPI controller

maintainers:
  - Yu-Tung Chang <mtwget@gmail.com>

allOf:
  - $ref: spi-controller.yaml#

properties:
  compatible:
    const: novatek,na51089-spi

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  novatek,no-dma:
    type: boolean
    description: Disable internal DMA and use PIO only.

  spi-slave: false

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - resets
  - "#address-cells"
  - "#size-cells"

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/clock/novatek,na51089-clock.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/reset/novatek,na51089-reset.h>

    spi@f0230000 {
        compatible = "novatek,na51089-spi";
        reg = <0xf0230000 0x10000>;
        clocks = <&cgu NA51089_CLK_SPI0>;
        interrupts = <GIC_SPI 35 IRQ_TYPE_LEVEL_HIGH>;
        resets = <&cgu NA51089_RESET_SPI0>;
        #address-cells = <1>;
        #size-cells = <0>;
    };

...
