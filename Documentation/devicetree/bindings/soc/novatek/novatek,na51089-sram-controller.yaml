%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/novatek/novatek,na51089-sram-controller.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NA51089 SRAM controller

maintainers:
  - Yudong Zhang <mtwget@gmail.com>

description:
  The SRAM controller provides a shared register controlling the shutdown
  state of the internal SRAMs used by the SoC peripherals.

properties:
  compatible:
    items:
      - const: novatek,na51089-sram-controller
      - const: syscon

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    system-controller@f0011000 {
        compatible = "novatek,na51089-sram-controller", "syscon";
        reg = <0xf0011000 0x4>;
    };

...
