%YAML 1.2
---
$id: http://devicetree.org/schemas/crypto/novatek,na51089-rsa.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Novatek NA51089 RSA accelerator

maintainers:
  - Yu-Tung Chang <mtwget@gmail.com>

properties:
  compatible:
    const: novatek,na51089-rsa

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    maxItems: 1

  resets:
    maxItems: 1

  power-domains:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - resets
  - power-domains

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/novatek,na51089-clock.h>
    #include <dt-bindings/interrupt-controller/arm-gic.h>
    #include <dt-bindings/power/novatek,na51089-sramctrl.h>
    #include <dt-bindings/reset/novatek,na51089-reset.h>

    crypto@f06a0000 {
        compatible = "novatek,na51089-rsa";
        reg = <0xf06a0000 0x100>;
        interrupts = <GIC_SPI 20 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&cgu NA51089_CLK_RSA>;
        resets = <&cgu NA51089_RESET_RSA>;
        power-domains = <&sramctrl NA51089_SRAM_SW_RSA>;
    };
